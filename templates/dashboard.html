<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="/static/js/dashboard.js" defer></script>


</head>

<body>
    <main class="dashboard-shell">
        <section class="dashboard-card">
            <p class="eyebrow">Your space</p>
            <h1>Dashboard</h1>

            <div class="profile-section">
                <div class="profile-img">
                    <img id="profilepreview" alt="profile picture" class="profile-image">

                    <label for="profileUpload" class="upload-btn"   >
                        <i class="fa-solid fa-arrow-up-from-bracket" aria-hidden="true"></i>
                    </label>

                    <input type="file" id="profileUpload" accept="image/*" hidden>
                </div>

                <div class="profile-info">
                    <div class="info-item">
                        <span class="info-label">Full Name</span>
                        <p id="userName">Your Name</p>
                    </div>

                    <div class="info-item">
                        <span class="info-label">Email</span>
                        <p id="userEmail">example@email.com</p>
                    </div>

                    <div class="info-item">
                        <span class="info-label">Phone Number</span>
                        <p id="phoneNumber">0123456789</p>
                    </div>

                    <div class="info-item">
                        <span class="info-label">Date of Birth</span>
                        <p id="userDOB">12-06-2006</p>
                    </div>

                    <button type="button" class="edit-profile-btn">
                        <i class="fa-solid fa-pen"></i>
                        Edit Profile
                    </button>
                    <button type="button" class="logout-btn" id="logoutBtn">
                        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
                        Logout
                    </button>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
