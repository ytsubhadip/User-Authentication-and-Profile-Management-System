<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/forgot_page.css">
</head>
<body>
    <main class="page-shell">
        <section class="form-card" aria-labelledby="forgot-password-title">
            <header class="form-header">
                <p class="eyebrow">Account recovery</p>
                <h1 id="forgot-password-title">Forgot your password?</h1>
                <p>
                    Enter your email address and we’ll send you a link to reset your password.
                </p>
            </header>

          
                <div class="email-row">
                    <div class="field">
                        <label for="user-email">Email address</label>
                        <input
                            type="email"
                            name="email"
                            id="user-email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                    <button type="button" id="OTPSendBtn">Send OTP</button>
                </div>

                <div class="field">
                    <label for="user-otp">OTP</label>
                    <input
                        type="text"
                        name="otp"
                        id="user-otp"
                        placeholder="Enter OTP"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        required
                    >
                </div>

                <div class="field">
                    <label for="user-newpassword">New Password</label>
                    <input
                        type="password"
                        name="password"
                        id="user-newpassword"
                        placeholder="Enter New Password"
                        required
                    >
                </div>
                
                <button type="button" id="VerifyEmailButton">Submit</button>

                <p class="form-footer">
                    Remembered your password?
                    <a href="/">Back to login</a>
                </p>
            
        </section>
    </main>
    <script src="/static/js/forgot_password.js"></script>
</body>
</html>
